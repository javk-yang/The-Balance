version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: finance-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: finance_db
      MYSQL_CHARSET: utf8mb4
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - finance-net

  # Spring Boot 后端
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finance-backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: finance_db
      DB_USER: root
      DB_PASS: root
      JWT_SECRET: ZmluYW5jZS1hcHAtc2VjcmV0LWtleS1mb3Itand0LXRva2VuLWdlbmVyYXRpb24tMjAyNg==
      FRONTEND_URL: http://localhost:8080,http://127.0.0.1:8080
    ports:
      - "8081:8081"
    depends_on:
      - mysql
    networks:
      - finance-net

  # Vue 前端
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finance-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - finance-net

volumes:
  mysql_data:

networks:
  finance-net:
    driver: bridge
